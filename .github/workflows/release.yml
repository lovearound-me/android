name: release

# Two bundles for one Google Play listing: the phone's and the watch's,
# signed with the upload key from the repo's secrets. They land as the
# run's artifacts; uploading to Play is done by hand for now.
on:
  workflow_dispatch:

jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "No UPLOAD_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build number
        # Phone: 1000 + the run; watch: 100000000 more (wear/build.gradle.kts).
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Bundles
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest :app:bundleRelease :wear:bundleRelease
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v5
        with:
          name: bundles-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/*.aab
            wear/build/outputs/bundle/release/*.aab
