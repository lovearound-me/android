name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Every text in every language
        run: python3 scripts/check-i18n.py
      - name: Tests (screens drawn with Robolectric), lint, release builds
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease -Proborazzi.test.record=true
      - name: Screens
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screens
          path: |
            app/build/outputs/roborazzi
            wear/build/outputs/roborazzi
